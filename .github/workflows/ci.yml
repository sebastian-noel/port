name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke-test the built homepage
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 1 --max-time 5 --output /tmp/port-home.html http://127.0.0.1:3000/
          grep -Fq 'Sebastian Noel</h1>' /tmp/port-home.html
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --no-first-run \
            --window-size=1280,800 --screenshot=/tmp/port-desktop.png http://127.0.0.1:3000/ 2>/tmp/port-chrome.log
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --no-first-run \
            --window-size=390,844 --screenshot=/tmp/port-mobile.png http://127.0.0.1:3000/ 2>>/tmp/port-chrome.log
          base64 -w 4096 /tmp/port-desktop.png | sed 's/^/PORT_DESKTOP_CHUNK /'
          base64 -w 4096 /tmp/port-mobile.png | sed 's/^/PORT_MOBILE_CHUNK /'
